[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unii"
version = "0.1.0"
description = "Official Python client library for Unii platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Unii Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/malviys/unii"
