[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unii"
version = "0.1.0"
description = "Official Python client library for Unii platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Unii Team", email = "dev@getunii.com" }]
keywords = ["unii", "ai", "sdk", "llm", "rag", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/founder-unii/unii-client"
Repository = "https://github.com/founder-unii/unii-client.git"
Issues = "https://github.com/founder-unii/unii-client/issues"
