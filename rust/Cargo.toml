[package]
name = "unii"
version = "0.1.0"
edition = "2021"
description = "Official Rust client SDK for Unii conversational AI platform"
license = "MIT"
readme = "README.md"
repository = "https://github.com/unii-founder/unii-client"
homepage = "https://github.com/unii-founder/unii-client"
authors = ["Unii Team <dev@getunii.com>"]
keywords = ["unii", "ai", "sdk", "llm", "rag"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

