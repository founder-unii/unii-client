name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - npm (typescript & react)
          - pypi (python)
          - crates (rust)
          - nuget (csharp)
          - rubygems (ruby)
          - pub (dart & flutter)
          - maven (java & kotlin)
          - go (module proxy)
          - packagist (php)

jobs:
  publish-npm:
    name: Publish npm (@unii/sdk & @unii/react)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'npm (typescript & react)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish @unii/sdk
        run: |
          cd typescript
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & Publish @unii/react
        run: |
          cd react
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI (Python)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'pypi (python)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build and Upload
        run: |
          cd python
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-crates:
    name: Publish Crates.io (Rust)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'crates (rust)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        run: |
          cd rust
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-nuget:
    name: Publish NuGet (.NET / C#)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'nuget (csharp)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack and Push to NuGet
        run: |
          cd csharp
          dotnet pack -c Release -o out
          dotnet nuget push out/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-rubygems:
    name: Publish RubyGems (Ruby)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'rubygems (ruby)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Build and Push Gem
        run: |
          cd ruby
          gem build unii.gemspec
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "${{ secrets.RUBYGEMS_API_KEY }}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push unii-*.gem

  publish-pub:
    name: Publish pub.dev (Dart & Flutter)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'pub (dart & flutter)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Publish Dart SDK
        run: |
          cd dart
          dart pub get
          dart pub publish --force

      - name: Publish Flutter SDK
        run: |
          cd flutter
          flutter pub get
          flutter pub publish --force

  publish-maven:
    name: Publish Maven Central (Java & Kotlin)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'maven (java & kotlin)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and Sign Java Bundle
        run: |
          cd java
          mvn clean package
          ./sign_and_bundle.sh

      - name: Upload Java Bundle to Central Portal
        run: |
          curl --fail --retry 3 \
            -H "Authorization: Bearer ${{ secrets.MAVEN_CENTRAL_TOKEN }}" \
            -F "bundle=@java/bundle-unii-java-sdk-0.1.0.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"

  publish-go:
    name: Notify Go Module Proxy
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'go (module proxy)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Request Go Proxy Indexing
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi
          GOPROXY=https://proxy.golang.org go list -m github.com/malviys/unii-go/go@$TAG || true

  publish-packagist:
    name: Update Packagist (PHP)
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'packagist (php)' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist Webhook
        run: |
          curl -s -XPOST \
            -H "content-type:application/json" \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/unii-founder/unii-client"}}' || true
